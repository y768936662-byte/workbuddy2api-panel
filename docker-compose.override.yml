# ============================================================
#  本机自用覆盖（docker compose 自动合并，不用手动 -f 指定）
#
#  作用：用宿主机交叉编译的 Linux 二进制覆盖容器内 /app/wb2api。
#
#  背景（2026-10-23）：
#    - 本机 Docker registry 镜像源不可达，无法 docker build 出带补丁的镜像；
#    - 补丁内容：internal/upstream/thinking.go 让 glm-5.1 这类
#      「必须带 reasoning_effort 才不被上游 400」的模型也能被
#      第三方客户端（如 WorkBuddy 自定义模型接入）直接调用。
#
#  重新编译并生效：
#    cd <本目录> && \
#    GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
#      go build -trimpath -ldflags="-s -w" -o wb2api-linux-amd64 ./cmd/server && \
#    docker compose -p workbuddy2api-desktop up -d --force-recreate
#
#  注意：wb2api-linux-amd64 是本机产物，不进版本库（见 .gitignore）。
#        文件缺失时 Docker 会把挂载点建成目录导致容器起不来 —— 编译一次即可。
# ============================================================
services:
  wb2api:
    volumes:
      - ./wb2api-linux-amd64:/app/wb2api:ro
